services:
  wrikmart-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrikmart-frontend
    restart: always
    ports:
      - "3004:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
